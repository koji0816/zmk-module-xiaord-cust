
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_I2C=y
# Increase input thread stack size: BT_CLR behavior calls bt_unpair() + settings_save_one()
# (flash write) deep in the call chain, which overflows the default 1024-byte stack
CONFIG_INPUT_THREAD_STACK_SIZE=2048

CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_PWM=y
CONFIG_GPIO=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_ARC=y
# CONFIG_LV_COLOR_SCREEN_TRANSP=y

# Color theme (LV_CONF_MINIMAL defaults all themes to n, so enable explicitly)
CONFIG_LV_USE_THEME_DEFAULT=y

# RTC (PCF8563 on Seeed XIAO Round Display — enabled via DT alias "rtc")
CONFIG_RTC=y

# Fonts for 240x240 display
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_FONT_MONTSERRAT_48=y

# performance
CONFIG_LV_Z_VDB_SIZE=100

# Scanner Mode Config — BLE Observer only (no advertising)
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_PROSPECTOR_MODE_SCANNER=y
CONFIG_PROSPECTOR_TOUCH_ENABLED=n
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_SCANNER_CHANNEL=0
CONFIG_PROSPECTOR_SCANNER_TIMEOUT_MS=10000
CONFIG_ZMK_SPLIT=n

# Stack sizes — BLE scan callback + LVGL need extra room
CONFIG_MAIN_STACK_SIZE=4096

# USB HID — required for &kp / &msc behaviors to send keycodes/scroll to PC
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y

# Enable logging for scanner debug
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_ZMK_USB_LOGGING=y
